<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Countdown</title>
  <meta name="description" content="A quiet countdown with rotating quotes.">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ece8e1' stroke-width='2.5'/%3E%3Cpath d='M16 10v6l4 3' fill='none' stroke='%23ece8e1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="stage">
    <section id="quotes" class="quotes" aria-live="polite" aria-atomic="true" aria-label="Quote">
      <figure class="quote is-active" data-layer="0">
        <blockquote class="quote-text"></blockquote>
        <figcaption class="quote-author" hidden></figcaption>
      </figure>
      <figure class="quote" data-layer="1" aria-hidden="true">
        <blockquote class="quote-text"></blockquote>
        <figcaption class="quote-author" hidden></figcaption>
      </figure>
    </section>
  </main>

  <footer class="footer">
    <p id="thanks" class="thanks" hidden></p>
    <p id="countdown" class="countdown" role="timer" aria-live="off">
      <span id="countdown-value" class="countdown-value">--:--</span>
      <span id="countdown-label" class="countdown-label"></span>
    </p>
  </footer>
</body>
</html>
